<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .bar { fill: #161b22; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .txt { font-family: "JetBrains Mono", "SF Mono", Menlo, Monaco, Consolas, "Courier New", monospace; font-size: 12.5px; line-height: 1.45; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .comment { fill: #8b949e; font-style: italic; }
      .out { fill: #c9d1d9; }
      .key { fill: #79c0ff; }
      .str { fill: #a5d6ff; }
      .num { fill: #7ee787; }
      .hl { fill: #ffa657; font-weight: 600; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; rx: 12px; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="880" height="540" class="bg" />
  <rect width="880" height="38" class="bar" rx="12" />
  <rect y="26" width="880" height="12" class="bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" class="dot-red" />
  <circle cx="40" cy="19" r="6" class="dot-yellow" />
  <circle cx="60" cy="19" r="6" class="dot-green" />
  
  <!-- Window Title -->
  <text x="440" y="24" class="title">transitshortcut — CLI Audit &amp; Training Session</text>
  <line x1="0" y1="38" x2="880" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Content -->
  <g transform="translate(24, 62)" class="txt">
    <!-- Step 1: Data Inspection -->
    <text y="0"><tspan class="comment"># 1. Inspect prepared cohort metadata &amp; observed construction traces</tspan></text>
    <text y="20"><tspan class="prompt">$ </tspan><tspan class="cmd">transitshortcut data inspect</tspan></text>
    <text y="38" class="out">{</text>
    <text y="56" class="out">  <tspan class="key">&quot;dataset_id&quot;</tspan>: <tspan class="str">&quot;bf209d70f7f08dec&quot;</tspan>,</text>
    <text y="74" class="out">  <tspan class="key">&quot;summary&quot;</tspan>: {</text>
    <text y="92" class="out">    <tspan class="key">&quot;classes&quot;</tspan>: { <tspan class="key">&quot;PLANET&quot;</tspan>: <tspan class="num">61</tspan>, <tspan class="key">&quot;NO_SIGNAL&quot;</tspan>: <tspan class="num">50</tspan>, <tspan class="key">&quot;FALSE_POSITIVE&quot;</tspan>: <tspan class="num">39</tspan> },</text>
    <text y="110" class="out">    <tspan class="key">&quot;artifact_counts&quot;</tspan>: { <tspan class="key">&quot;missing_transit&quot;</tspan>: <tspan class="num">54</tspan>, <tspan class="key">&quot;zero_folded&quot;</tspan>: <tspan class="num">54</tspan>, <tspan class="key">&quot;missing_flags&quot;</tspan>: <tspan class="num">99</tspan> }</text>
    <text y="128" class="out">  }</text>
    <text y="146" class="out">}</text>

    <!-- Step 2: Training -->
    <text y="174"><tspan class="comment"># 2. Train and evaluate Shortcut Baseline vs Raw Photometry Signal Model</tspan></text>
    <text y="194"><tspan class="prompt">$ </tspan><tspan class="cmd">transitshortcut train --experiment multiclass</tspan></text>
    <text y="212" class="str">multiclass-fa5e956a20</text>
    <text y="230" class="out"><tspan class="hl">shortcut:</tspan> { &quot;n&quot;: 30, &quot;accuracy&quot;: <tspan class="num">0.8333</tspan>, &quot;balanced_accuracy&quot;: <tspan class="num">0.8472</tspan>, <tspan class="hl">&quot;macro_f1&quot;: 0.8329</tspan> }</text>
    <text y="248" class="out"><tspan class="key">signal:  </tspan> { &quot;n&quot;: 30, &quot;accuracy&quot;: <tspan class="num">0.5667</tspan>, &quot;balanced_accuracy&quot;: <tspan class="num">0.5333</tspan>, <tspan class="key">&quot;macro_f1&quot;: 0.5333</tspan> }</text>

    <!-- Step 3: Feature-Group Refit Ablation Audit -->
    <text y="278"><tspan class="comment"># 3. Print feature-group refit audit (measure model reliance on artifacts)</tspan></text>
    <text y="298"><tspan class="prompt">$ </tspan><tspan class="cmd">transitshortcut audit --experiment multiclass</tspan></text>
    <text y="316" class="out">[</text>
    <text y="334" class="out">  {</text>
    <text y="352" class="out">    <tspan class="key">&quot;group&quot;</tspan>: <tspan class="str">&quot;Transit availability&quot;</tspan>,</text>
    <text y="370" class="out">    <tspan class="key">&quot;macro_f1_drop&quot;</tspan>: <tspan class="num">0.0349</tspan>, <tspan class="key">&quot;changed_n&quot;</tspan>: <tspan class="num">1</tspan>, <tspan class="key">&quot;mean_max_score_delta&quot;</tspan>: <tspan class="num">0.0694</tspan></text>
    <text y="388" class="out">  },</text>
    <text y="406" class="out">  {</text>
    <text y="424" class="out">    <tspan class="key">&quot;group&quot;</tspan>: <tspan class="str">&quot;Folded zeros&quot;</tspan>,</text>
    <text y="442" class="out">    <tspan class="key">&quot;macro_f1_drop&quot;</tspan>: <tspan class="num">0.0000</tspan>, <tspan class="key">&quot;changed_n&quot;</tspan>: <tspan class="num">0</tspan>, <tspan class="key">&quot;mean_max_score_delta&quot;</tspan>: <tspan class="num">0.0035</tspan></text>
    <text y="460" class="out">  }</text>
    <text y="478" class="out">]</text>
  </g>

  <!-- Border -->
  <rect width="880" height="540" class="border" />
</svg>
